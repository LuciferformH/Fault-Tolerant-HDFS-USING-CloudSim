# HDFS Configuration for Scientific Research Archive

# Network Configuration
network.topology=rack-aware
network.rack.count=2
network.switches.per.rack=1

# HDFS Parameters
hdfs.block.size=128
hdfs.replication.factor=3
hdfs.replication.min=2
hdfs.replication.max=5
hdfs.block.report.interval=3600
hdfs.heartbeat.interval=3

# Data Center Regions
dc1.name=US-East
dc1.region=us-east-1
dc1.latency=10

dc2.name=US-West
dc2.region=us-west-1
dc2.latency=15

dc3.name=EU
dc3.region=eu-west-1
dc3.latency=25

dc4.name=Asia-Pacific
dc4.region=ap-southeast-1
dc4.latency=30

# VM Configuration
vm.cpu.mips=1000
vm.cpu.cores=2
vm.ram=2048
vm.bandwidth=10000
vm.storage=50000

# Workload Parameters
workload.cloudlets.per.hour=5000
workload.avg.cloudlet.length=1000
workload.avg.file.size=300
workload.avg.output.size=300

# Simulation Parameters
simulation.start.time=0
simulation.end.time=3600
simulation.time.unit=seconds

# Failure Event Parameters
failure.enabled=true
failure.vm.count=5
failure.time=1800

# Resource Allocation Policies
policy.round.robin.enabled=true
policy.throttled.enabled=true
policy.space.shared.enabled=true

# Performance Metrics
metrics.response.time=true
metrics.throughput=true
metrics.data.locality=true
metrics.energy.consumption=true